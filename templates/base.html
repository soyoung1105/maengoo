<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}블로그{% endblock %}</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    {% load static %}
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>
<body>
    <!-- 네비게이션 바 -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
        <div class="container">
            <a class="navbar-brand" href="{% url 'posts:post_list' %}">블로그</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'posts:post_list' %}">게시글 목록</a>
                    </li>
                    {% if user.is_authenticated %}
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'posts:post_create' %}">새 글 작성</a>
                    </li>
                    {% endif %}
                </ul>
                <div class="d-flex">
                    {% if user.is_authenticated %}
                        <span class="nav-link me-3">안녕하세요, {{ user.username }}님!</span>
                        <a href="{% url 'users:logout' %}" class="btn btn-outline-primary">로그아웃</a>
                    {% else %}
                        <a href="{% url 'users:login' %}" class="btn btn-outline-primary me-2">로그인</a>
                        <a href="{% url 'users:signup' %}" class="btn btn-primary">회원가입</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <!-- 메인 컨텐츠 -->
    <main>
        {% block content %}
        {% endblock %}
    </main>

    <!-- 푸터 -->
    <footer class="footer">
        <div class="container">
            <p class="text-muted mb-0">&copy; 2024 블로그. All rights reserved.</p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
