{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="card">
        <div class="card-body">
            <h1 class="card-title mb-4">
                {% if form.instance.pk %}
                게시글 수정
                {% else %}
                새 게시글 작성
                {% endif %}
            </h1>
            
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="{{ form.title.id_for_label }}" class="form-label">제목</label>
                    {{ form.title }}
                </div>
                <div class="mb-3">
                    <label for="{{ form.author.id_for_label }}" class="form-label">작성자</label>
                    {{ form.author }}
                </div>
                <div class="mb-3">
                    <label for="{{ form.content.id_for_label }}" class="form-label">내용</label>
                    {{ form.content }}
                </div>
                
                <div class="mt-4">
                    <button type="submit" class="btn btn-primary">저장</button>
                    <a href="{% url 'post_list' %}" class="btn btn-secondary">취소</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
