{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h1 class="mb-4">게시글 목록</h1>
    
    <div class="row">
        {% for post in posts %}
        <div class="col-md-12 mb-3">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">
                        <a href="{% url 'post_detail' pk=post.pk %}" class="text-decoration-none">{{ post.title }}</a>
                    </h5>
                    <p class="card-text">
                        <small class="text-muted">
                            작성자: {{ post.author }} | 
                            조회수: {{ post.views }} | 
                            작성일: {{ post.created_at|date:"Y-m-d H:i" }}
                        </small>
                    </p>
                </div>
            </div>
        </div>
        {% empty %}
        <div class="col-12">
            <p class="text-center">게시글이 없습니다.</p>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
