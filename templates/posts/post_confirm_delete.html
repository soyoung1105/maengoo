{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="card">
        <div class="card-body">
            <h1 class="card-title mb-4">게시글 삭제</h1>
            
            <p class="mb-4">정말로 "{{ post.title }}" 게시글을 삭제하시겠습니까?</p>
            
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">삭제</button>
                <a href="{% url 'posts:post_detail' pk=post.pk %}" class="btn btn-secondary">취소</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
